name: "SonarQube Code Analysis"

on:
  push:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: [ 'self-hosted', 'Linux' ]
    environment: SonarQube
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Ensure pnpm store dir
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Run Rust Clippy (Export for SonarQube)
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features --message-format=json > clippy-report.json || true
          
      - name: SonarQube Scan (Node.js Version)
        run: pnpm dlx sonarqube-scanner -Dsonar.ws.timeout=600
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
