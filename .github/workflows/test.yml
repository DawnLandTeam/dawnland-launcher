name: Test

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-rust:
    name: Rust Backend Tests
    runs-on: [ 'self-hosted', 'Windows' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install or Repair Rust (Windows Self-Hosted)
        shell: powershell
        run: |
          Write-Host "=== Rust toolchain bootstrap: start ==="

          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            Write-Host "rustup found. Updating and verifying toolchain..."
            rustup self update
            rustup update
            rustup default stable
            rustup component add clippy || Write-Host "clippy component not available/failed to add"
            rustup component add rust-src || Write-Host "rust-src component not available/failed to add"
          } else {
            Write-Host "rustup not found. Installing rustup-init.exe..."
            Invoke-WebRequest -Uri https://win.rustup.rs/ -OutFile rustup-init.exe
            Start-Process -FilePath .\rustup-init.exe -ArgumentList '-y','--default-toolchain','stable','--profile','default' -Wait
          }

          # Ensure the cargo bin directory is on PATH for subsequent steps
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          if (-Not ($env:Path -split ';' | Where-Object { $_ -eq $cargoBin })) {
            Write-Host "Adding $cargoBin to PATH for this job..."
            echo $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          Write-Host "Inspecting cargo/rustup state..."
          Write-Host "where cargo:"; where.exe cargo || Write-Host "where.exe failed"
          Write-Host "rustup --version:"; rustup --version 2>&1 | Write-Host
          Write-Host "rustup show:"; rustup show 2>&1 | Write-Host

          # Validate cargo works and is compatible; if not, reinstall the stable toolchain
          $cargoOk = $false
          try {
            Write-Host "cargo --version:"; cargo --version 2>&1 | Write-Host
            $cargoOk = $true
          } catch {
            Write-Host "cargo --version failed: $_"
            $cargoOk = $false
          }

          if (-Not $cargoOk) {
            Write-Host "cargo unusable or incompatible. Reinstalling stable toolchain via rustup..."
            rustup toolchain install stable-x86_64-pc-windows-msvc -y
            rustup default stable-x86_64-pc-windows-msvc
            Write-Host "After reinstall: cargo --version:"; cargo --version 2>&1 | Write-Host
          }

          Write-Host "=== Rust toolchain bootstrap: end ==="

      - name: Configure persistent Cargo target dir
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/cargo-target" >> $GITHUB_ENV

      - name: Cache Cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/src-tauri/Cargo.lock','**/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Cargo Tests and Strict Clippy
        working-directory: ./src-tauri
        run: |
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings

  test-frontend:
    name: Vue Frontend Tests
    runs-on: [ 'self-hosted', 'Linux' ]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 11
      - name: Ensure pnpm store dir
        run: pnpm config set store-dir ~/.pnpm-store
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: pnpm install
      - name: Run Vitest
        run: pnpm run test
