name: Test

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-rust:
    name: Rust Backend Tests
    runs-on: [ 'self-hosted', 'Windows' ]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (Windows Self-Hosted)
        shell: powershell
        run: |
          # Robust Rust installer / fixer for self-hosted Windows runners
          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            rustup self update
            rustup update
            rustup default stable
            rustup component add clippy || Write-Host "clippy add failed"
            rustup component add rust-src || Write-Host "rust-src add failed"
          } else {
            Invoke-WebRequest -Uri https://win.rustup.rs/ -OutFile rustup-init.exe
            Start-Process -FilePath .\rustup-init.exe -ArgumentList '-y','--default-toolchain','stable','--profile','default' -Wait
          }
          # Ensure correct cargo in PATH
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          echo $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          Write-Host "where cargo:"; where.exe cargo
          Write-Host "rustup which cargo:"; rustup which cargo
          Write-Host "cargo --version:"; cargo --version
          
          # If cargo --version failed, reinstall toolchain
          try { cargo --version; } catch {
            Write-Host "cargo unusable, reinstalling..."
            rustup toolchain install stable-x86_64-pc-windows-msvc --force
            rustup default stable-x86_64-pc-windows-msvc
            cargo --version
          }
      - name: Configure persistent Cargo target dir
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/cargo-target" >> $GITHUB_ENV

      - name: Cache Cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/src-tauri/Cargo.lock','**/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Cargo Tests and Strict Clippy
        working-directory: ./src-tauri
        run: |
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings

  test-frontend:
    name: Vue Frontend Tests
    runs-on: [ 'self-hosted', 'Linux' ]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 11
      - name: Ensure pnpm store dir
        run: pnpm config set store-dir ~/.pnpm-store
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: pnpm install
      - name: Run Vitest
        run: pnpm run test
