name: "SonarQube Code Analysis"

on:
  push:
    branches: [ "main" ]

jobs:
  analyze:
    runs-on: [ 'self-hosted', 'debian-13' ]
    environment: SonarQube
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Ensure pnpm store dir
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure persistent Cargo target dir
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/cargo-target" >> $GITHUB_ENV

      - name: Cache Cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/src-tauri/Cargo.lock','**/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Run Rust Clippy (Export for SonarQube)
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features --message-format=json > clippy-report.json || true
          
      - name: SonarQube Scan (Node.js Version)
        run: pnpm --package=sonarqube-scanner dlx sonar-scanner -Dsonar.ws.timeout=600
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
