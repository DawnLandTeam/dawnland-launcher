name: Test

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-rust:
    name: Rust Backend Tests
    runs-on: [ 'self-hosted', 'Windows' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install / Repair Rust (Windows Self-Hosted)
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: |
          Write-Host "=== Rust toolchain bootstrap: start ==="
      
          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            Write-Host "rustup found. Updating..."
            rustup self update
            rustup update
            rustup default stable
          } else {
            Write-Host "rustup not found. Installing rustup-init.exe..."
            Invoke-WebRequest -Uri https://win.rustup.rs/ -OutFile rustup-init.exe -UseBasicParsing
            Start-Process -FilePath .\rustup-init.exe -ArgumentList '-y','--default-toolchain','stable','--profile','default' -Wait -NoNewWindow
          }
      
          # Ensure cargo component exists for the toolchain
          try { rustup component add cargo --toolchain stable-x86_64-pc-windows-msvc } catch { Write-Host "cargo component add warning: $_" }
          try { rustup component add clippy --toolchain stable-x86_64-pc-windows-msvc } catch { Write-Host "clippy add warning: $_" }
      
          # Prepend rustup-managed cargo to PATH for subsequent steps
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          $newPath = "$cargoBin;$env:Path"
          echo "PATH=$newPath" >> $env:GITHUB_ENV
      
          # Diagnostics (can remove after CI stable)
          Write-Host "where cargo ->"; (& where.exe cargo) 2>&1 | Write-Host
          Write-Host "rustup which cargo ->"; try { rustup which cargo | Write-Host } catch { Write-Host "rustup which cargo failed: $_" }
          Write-Host "cargo --version ->"; try { (& cargo --version) 2>&1 | Write-Host } catch { Write-Host "cargo --version failed: $_" }
      
          Write-Host "=== Rust toolchain bootstrap: end ==="

      - name: Configure persistent Cargo target dir
        run: echo "CARGO_TARGET_DIR=$HOME/.cache/cargo-target" >> $GITHUB_ENV
      
      - name: Cache Cargo registry, git and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/src-tauri/Cargo.lock','**/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Cargo Tests and Strict Clippy
        working-directory: ./src-tauri
        run: |
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings

  test-frontend:
    name: Vue Frontend Tests
    runs-on: [ 'self-hosted', 'Linux' ]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Ensure pnpm is on PATH
        run: echo "$PNPM_HOME" >> $GITHUB_PATH

      - name: Ensure pnpm store dir
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Run Vitest
        run: pnpm run test
