name: 'Dawnland Launcher Release'
run-name: 'Release ${{ github.ref_name }}'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment: release
    env:
      NODE_OPTIONS: "--use-system-ca"
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows task -> Route to Windows machine
          - platform: 'windows-x86_64'
            runner: [ 'self-hosted', 'Windows' ] # Must match the label set on Windows node
            args: ''

          # 2. Linux task -> Route to NAS
          - platform: 'ubuntu-22_04'
            runner: [ 'self-hosted', 'Linux' ]   # Must match the label set in Docker compose
            args: ''

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update version based on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            // Extract version exactly from refs/tags/v1.0.0
            const version = '${{ github.ref_name }}'.replace(/^v/, '');
            console.log(`Setting version to ${version}`);
            
            // Export VERSION to GITHUB_ENV for the final exe upload step
            core.exportVariable('VERSION', version);
            
            // 1. Update package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            
            // 2. Update tauri.conf.json
            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = version;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
            
            // 3. Update Cargo.toml
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version\s*=\s*".*?"/m, `version = "${version}"`);
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);

      # Note: fixed platform match name
      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22_04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file wget

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      # 1. Official plugin for Mac and Linux nodes (skipping Windows)
      - name: Install Rust (Mac & Linux)
        if: matrix.platform != 'windows-x86_64'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.platform == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      # 2. For Windows node: Smart detect and install Rust
      - name: Install / Repair Rust (Windows Self-Hosted)
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: |
          Write-Host "=== Rust toolchain bootstrap: start ==="
      
          if (Get-Command rustup -ErrorAction SilentlyContinue) {
            Write-Host "rustup found. Updating..."
            rustup self update
            rustup update
            rustup default stable
          } else {
            Write-Host "rustup not found. Installing rustup-init.exe..."
            Invoke-WebRequest -Uri https://win.rustup.rs/ -OutFile rustup-init.exe -UseBasicParsing
            Start-Process -FilePath .\rustup-init.exe -ArgumentList '-y','--default-toolchain','stable','--profile','default' -Wait -NoNewWindow
          }
      
          # Ensure cargo component exists for the toolchain
          try { rustup component add cargo --toolchain stable-x86_64-pc-windows-msvc } catch { Write-Host "cargo component add warning: $_" }
          try { rustup component add clippy --toolchain stable-x86_64-pc-windows-msvc } catch { Write-Host "clippy add warning: $_" }
      
          # Prepend rustup-managed cargo to PATH for subsequent steps
          $cargoBin = "$env:USERPROFILE\.cargo\bin"
          $newPath = "$cargoBin;$env:Path"
          echo "PATH=$newPath" >> $env:GITHUB_ENV
      
          # Diagnostics (can remove after CI stable)
          Write-Host "where cargo ->"; (& where.exe cargo) 2>&1 | Write-Host
          Write-Host "rustup which cargo ->"; try { rustup which cargo | Write-Host } catch { Write-Host "rustup which cargo failed: $_" }
          Write-Host "cargo --version ->"; try { (& cargo --version) 2>&1 | Write-Host } catch { Write-Host "cargo --version failed: $_" }
      
          Write-Host "=== Rust toolchain bootstrap: end ==="

      # - name: Cache Cargo registry, git and target
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cargo/registry
      #       ~/.cargo/git
      #       src-tauri/target
      #     key: ${{ runner.os }}-cargo-${{ hashFiles('**/src-tauri/Cargo.lock','**/src-tauri/Cargo.toml') }}
      #     restore-keys: |
      #       ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri App
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # VITE_WEB_BACKEND_URL is sourced from vars because it's public/environment-specific configuration
          VITE_WEB_BACKEND_URL: ${{ vars.VITE_WEB_BACKEND_URL }}
          # LAUNCHER_API_SECRET and APTABASE_KEY are sourced from secrets because they are sensitive credentials
          LAUNCHER_API_SECRET: ${{ secrets.LAUNCHER_API_SECRET }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          APTABASE_URL: ${{ secrets.APTABASE_URL }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Generate MD5 Checksums
        run: |
          node -e "
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          
          function generateMd5(filePath) {
            if (fs.existsSync(filePath)) {
              const buffer = fs.readFileSync(filePath);
              const md5Str = crypto.createHash('md5').update(buffer).digest('hex');
              fs.writeFileSync(filePath + '.md5', md5Str);
              console.log('Generated MD5 for ' + filePath + ': ' + md5Str);
            }
          }
          
          generateMd5('src-tauri/target/release/DLML.exe');
          
          const appImageDir = 'src-tauri/target/release/bundle/appimage';
          if (fs.existsSync(appImageDir)) {
            const files = fs.readdirSync(appImageDir);
            for (const file of files) {
              if (file.endsWith('.AppImage')) {
                generateMd5(path.join(appImageDir, file));
              }
            }
          }
          "

      - name: Upload Windows Release Assets to Workflow Artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/DLML.exe
            src-tauri/target/release/DLML.exe.md5

      - name: Upload Linux Release Assets to Workflow Artifacts
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'ubuntu-22_04'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.md5

      - name: Upload Release Artifacts to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VERSION: ${{ env.VERSION }}
        run: node .github/scripts/upload_to_r2.js

  # Deferred until publish-tauri passes the release environment gate and all matrix builds succeed.
  create-release:
    needs: publish-tauri
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [ 'self-hosted', 'Linux' ]
    permissions:
      contents: write
    steps:
      - name: Clean artifact staging directory
        run: rm -rf release-assets

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Create or Reuse Draft Release and Upload Assets by Release ID
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = context.ref.replace(/^refs\/tags\//, '');
            if (!tag) {
              throw new Error(`Unexpected ref without tag: ${context.ref}`);
            }
            const version = tag.replace(/^v/, '');
            const { owner, repo } = context.repo;

            function collectFiles(dir) {
              if (!fs.existsSync(dir)) return [];
              const results = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  results.push(...collectFiles(fullPath));
                } else if (entry.isFile()) {
                  results.push(fullPath);
                }
              }
              return results;
            }

            const files = collectFiles('release-assets');
            const names = files.map((f) => path.basename(f));
            const hasExe = names.includes('DLML.exe') && names.includes('DLML.exe.md5');
            const hasAppImage =
              names.some((n) => n.endsWith('.AppImage')) &&
              names.some((n) => n.endsWith('.AppImage.md5'));

            if (!hasExe || !hasAppImage) {
              throw new Error(`Incomplete release assets before release creation: ${names.join(', ')}`);
            }

            async function findReleaseByTag() {
              // listReleases includes draft releases when authenticated with contents:write,
              // whereas getReleaseByTag returns 404 for drafts.
              for await (const response of github.paginate.iterator(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 }
              )) {
                const match = response.data.find((r) => r.tag_name === tag);
                if (match) return match;
              }
              return null;
            }

            let release = await findReleaseByTag();
            let createdByRun = false;

            if (!release) {
              try {
                const created = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tag,
                  name: `v${version}`,
                  draft: true,
                  prerelease: version.includes('-'),
                  body: '🚀 **Dawnland Launcher Update**\n\nSee the assets below to download this version and install.'
                });
                release = created.data;
                createdByRun = true;
                console.log(`Created draft release #${release.id} for tag ${tag}`);
              } catch (error) {
                if (error.status === 422) {
                  release = await findReleaseByTag();
                  if (!release) throw error;
                  console.log(`Reusing existing release #${release.id} after concurrent creation`);
                } else {
                  throw error;
                }
              }
            } else {
              console.log(`Reusing existing release #${release.id} for tag ${tag} (draft=${release.draft}, prerelease=${release.prerelease})`);
            }

            try {
              const existingAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                { owner, repo, release_id: release.id, per_page: 100 }
              );

              for (const filePath of files) {
                const fileName = path.basename(filePath);
                const existingAsset = existingAssets.find((a) => a.name === fileName);
                if (existingAsset) {
                  console.log(`Replacing existing asset ${fileName} (#${existingAsset.id}) on release #${release.id}`);
                  await github.rest.repos.deleteReleaseAsset({
                    owner,
                    repo,
                    asset_id: existingAsset.id
                  });
                }

                const fileBuffer = fs.readFileSync(filePath);
                console.log(`Uploading ${fileName} (${fileBuffer.length} bytes) to release #${release.id}...`);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: release.id,
                  name: fileName,
                  data: fileBuffer,
                  headers: {
                    'content-type': 'application/octet-stream',
                    'content-length': fileBuffer.length
                  }
                });
              }
            } catch (error) {
              if (createdByRun) {
                console.error(`Asset upload failed; removing incomplete draft release #${release.id}`);
                try {
                  await github.rest.repos.deleteRelease({
                    owner,
                    repo,
                    release_id: release.id
                  });
                } catch (cleanupErr) {
                  console.error(`Failed to delete incomplete draft release #${release.id}:`, cleanupErr);
                }
              }
              throw error;
            }

      - name: Cleanup artifact staging directory
        if: always()
        run: rm -rf release-assets
